<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch Cá Nhân - Calendar App</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="calendar-container">
    <div class="calendar-left">
      <div class="calendar-header">
        <h2 id="month-year-display">Tháng 1, 2026</h2>
        <div class="nav-btns">
          <button id="prev-btn" title="Tháng trước"><i class="fa-solid fa-chevron-left"></i></button>
          <button id="today-btn">Hôm nay</button>
          <button id="next-btn" title="Tháng sau"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      </div>

      <div class="weekdays">
        <div>CN</div>
        <div>T2</div>
        <div>T3</div>
        <div>T4</div>
        <div>T5</div>
        <div>T6</div>
        <div>T7</div>
      </div>

      <div class="days-grid" id="days-grid"></div>
    </div>

    <div class="sidebar-right">
      <div class="sidebar-header">
        <h3>Công việc ngày</h3>
        <p id="selected-date-text">Chưa chọn ngày</p>
      </div>

      <div class="event-input-group">
        <input type="text" id="event-input" placeholder="Thêm ghi chú/công việc...">
        <button id="add-event-btn">Thêm</button>
      </div>

      <ul class="event-list" id="event-list">
      </ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
